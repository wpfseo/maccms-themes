<html lang="zh-CN">
    <head>
        <title>微信支付 - {$conch_theme.site_name|mac_default=$maccms.site_name}</title>
        {include file="public/include"}
    </head>
    <body>

        {include file="public/head"}

        <main class="hl-auth-page">
            <div class="hl-auth-wrapper hl-auth-wrapper-narrow">
                <div class="hl-auth-card">

                    <div class="hl-auth-header">
                        <span class="hl-auth-badge"> WeChat Pay</span>
                        <h2 class="hl-auth-title">微信扫码支付</h2>
                        <p class="hl-auth-desc">请使用微信扫描二维码完成支付</p>
                    </div>

                    <div class="hl-qrcode-wrapper">
                        <div class="hl-qrcode-box">
                            <img class="hl-qrcode-img" src="{:url('user/qrcode')}?data={$payment.code_url}" alt="微信支付二维码">
                            <div class="hl-qrcode-tip">
                                <span class="hl-qrcode-tip-icon"></span>
                                <span>打开微信扫一扫</span>
                            </div>
                        </div>
                    </div>

                    <div class="hl-order-info">
                        <div class="hl-order-info-item">
                            <span class="hl-order-info-label">订单号</span>
                            <span class="hl-order-info-value hl-order-confirm-value">{$info.order_code}</span>
                        </div>
                        <div class="hl-order-info-item">
                            <span class="hl-order-info-label">支付金额</span>
                            <span class="hl-order-info-value hl-order-info-price">¥{$info.order_price}</span>
                        </div>
                        <div class="hl-order-info-item">
                            <span class="hl-order-info-label">获得积分</span>
                            <span class="hl-order-info-value hl-order-info-points">+{$info.order_points}</span>
                        </div>
                    </div>

                    <div class="hl-pay-status" id="payStatus">
                        <span class="hl-pay-status-dot"></span>
                        <span class="hl-pay-status-text">等待支付...</span>
                    </div>

                    <div class="hl-auth-footer">
                        <a class="hl-auth-link" href="{:url('user/orders')}">查看订单 →</a>
                        <a class="hl-auth-link hl-auth-link-muted" href="{:url('user/index')}">会员中心</a>
                    </div>

                </div>
            </div>
        </main>

        {include file="public/foot"}

        <script type="text/javascript" src="{$maccms.path_tpl}static/js/user/user_payment_weixin.js?v={$version}"></script>

    </body>
</html>
